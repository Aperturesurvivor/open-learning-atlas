name: Validate atlas

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install JSON Schema validator
        run: python -m pip install --disable-pip-version-check check-jsonschema
      - name: Run semantic validation
        run: tools/validate-map
      - name: Verify reproducible atlas release
        run: tools/build-atlas --check
      - name: Verify reproducible release package
        run: tools/build-release --check
      - name: Report Mathematics v1 coverage
        run: tools/audit-v1
      - name: Audit textual and review-state quality signals
        run: tools/audit-quality
      - name: Test agent queries and downstream conformance
        run: tools/query-atlas stats > /dev/null && tools/run-conformance
      - name: Validate migration semantics
        run: tools/validate-migrations
      - name: Verify review inventory and ledger structure
        run: tools/build-review-inventory --check && tools/validate-reviews
      - name: Check repository documentation links
        run: tools/check-links
      - name: Run JSON Schema validation
        run: >-
          check-jsonschema
          --schemafile map/schema/open-learning-atlas.schema.json
          map/domains/*.json map/examples/*.json map/releases/*.json
      - name: Validate migration JSON Schema
        run: >-
          check-jsonschema
          --schemafile map/schema/open-learning-atlas-migration.schema.json
          migrations/examples/*.json
      - name: Validate territory review JSON Schema
        run: >-
          check-jsonschema
          --schemafile review/schema/territory-review.schema.json
          review/territory-reviews.json
  viewer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: viewer
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - name: Install viewer dependencies
        run: npm ci
      - name: Test viewer logic
        run: npm test
      - name: Build viewer from canonical data
        run: npm run build
      - name: Verify synchronized data
        run: npm run check-data
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate
